<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Anagramas por Frases Pro</title>
    <style>
        :root {
            /* Windows 11 Dark Theme Colors */
            --bg-base: #202020;
            --bg-card: #2d2d2d;
            --bg-input: #191919;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-focus: #60cdff;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --accent: #60cdff;
            --accent-hover: #50b6e6;
            --radius-md: 8px;
            --radius-sm: 4px;
            --font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --shadow-flyout: 0 8px 16px rgba(0,0,0,0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-family);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            padding: 12px 20px;
            background-color: var(--bg-base);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 16px;
            font-weight: 600;
        }

        /* Main Layout */
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
            flex-direction: row;
        }

        /* Sidebar Controls */
        .sidebar {
            width: 360px;
            background-color: var(--bg-card);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
        }

        input[type="text"], textarea, select {
            width: 100%;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            font-family: var(--font-family);
            font-size: 14px;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--border-focus);
            border-bottom: 2px solid var(--border-focus);
            padding-bottom: 7px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .row-inputs {
            display: flex;
            gap: 8px;
        }
        .row-inputs > div {
            flex: 1;
        }

        /* Toggles Switch Container */
        .toggles-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: rgba(0,0,0,0.15);
            padding: 10px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
        }

        .toggle-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            cursor: pointer;
        }

        .toggle-item input {
            cursor: pointer;
            accent-color: var(--accent);
            width: 14px;
            height: 14px;
        }

        /* Buttons */
        .btn {
            background-color: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.15s ease;
        }

        .btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .btn-primary {
            background-color: var(--accent);
            color: #000;
            border: none;
            font-weight: 600;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .button-group {
            display: flex;
            gap: 8px;
        }

        .button-group .btn {
            flex: 1;
        }

        svg.icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* Preview Area */
        .preview-area {
            flex: 1;
            background-color: var(--bg-base);
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
        }

        .canvas-wrapper {
            background-color: white;
            box-shadow: var(--shadow-flyout);
            border-radius: 4px;
            width: 100%;
            max-width: 700px;
            aspect-ratio: 3/4;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #svgPreview {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                max-height: 45vh;
            }
            .preview-area {
                padding: 12px;
            }
            .btn span.label {
                display: none;
            }
            .btn {
                padding: 8px;
            }
        }
    </style>
</head>
<body>

    <header>
        <svg class="icon" viewBox="0 0 24 24" style="color: var(--accent); width: 20px; height: 20px;">
            <path d="M12 2L2 22h20L12 2zm0 3.8l7.1 14.2H4.9L12 5.8z"/>
        </svg>
        <h1>Generador de Anagramas por Frases (Criptograma)</h1>
    </header>

    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="control-group">
                <label for="docTitle">Título</label>
                <input type="text" id="docTitle" value="Descifra el Anagrama">
            </div>

            <div class="control-group">
                <label for="docSubtitle">Subtítulo / Instrucciones</label>
                <input type="text" id="docSubtitle" value="Ordena las letras de cada palabra para revelar la frase oculta.">
            </div>

            <div class="control-group">
                <label for="phraseInput">Frase(s) (una por línea)</label>
                <textarea id="phraseInput">LA CURIOSIDAD VENCE A LA IGNORANCIA
EL CONOCIMIENTO ES PODER INFINITO</textarea>
            </div>

            <div class="control-group">
                <label>Elementos visibles</label>
                <div class="toggles-grid">
                    <label class="toggle-item"><input type="checkbox" id="chkTitle" checked> Título</label>
                    <label class="toggle-item"><input type="checkbox" id="chkSubtitle" checked> Subtítulo</label>
                    <label class="toggle-item"><input type="checkbox" id="chkName" checked> Nombre</label>
                    <label class="toggle-item"><input type="checkbox" id="chkDate" checked> Fecha</label>
                    <label class="toggle-item"><input type="checkbox" id="chkClass" checked> Aula</label>
                </div>
            </div>

            <div class="control-group">
                <label for="dimensionSelect">Dimensiones de Exportación</label>
                <select id="dimensionSelect" onchange="updateDimensions()">
                    <option value="a4">A4 vertical (794 x 1123)</option>
                    <option value="3:4" selected>3:4 Estándar (794 x 1059)</option>
                    <option value="1:1">1:1 Cuadrado (1000 x 1000)</option>
                    <option value="4:3">4:3 Horizontal (1024 x 768)</option>
                    <option value="16:9">16:9 Pantalla (1280 x 720)</option>
                    <option value="custom">Personalizado</option>
                </select>
            </div>

            <div class="row-inputs" id="customDimBox" style="display: none;">
                <div class="control-group">
                    <label for="customWidth">Ancho (px)</label>
                    <input type="text" id="customWidth" value="800">
                </div>
                <div class="control-group">
                    <label for="customHeight">Alto (px)</label>
                    <input type="text" id="customHeight" value="1000">
                </div>
            </div>

            <button class="btn btn-primary" onclick="generatePuzzle()">
                <svg class="icon" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                <span class="label">Generar Anagramas</span>
            </button>

            <div class="button-group">
                <button class="btn" onclick="exportSVG()">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 11h-2v-2h2v2zm0-4h-2V6h2v4zm4 4h-2v-2h2v2zm0-4h-2V6h2v4z"/></svg>
                    <span class="label">Exportar SVG</span>
                </button>
                <button class="btn" onclick="exportPNG()">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                    <span class="label">Exportar PNG (300 DPI)</span>
                </button>
            </div>
        </div>

        <!-- Preview -->
        <div class="preview-area">
            <div class="canvas-wrapper" id="canvasWrapper">
                <!-- SVG Preview -->
            </div>
        </div>
    </div>

    <script>
        let svgWidth = 794;
        let svgHeight = 1059;
        let currentSVGData = '';

        function updateDimensions() {
            const val = document.getElementById('dimensionSelect').value;
            const customBox = document.getElementById('customDimBox');
            const wrapper = document.getElementById('canvasWrapper');

            if (val === 'a4') {
                svgWidth = 794; svgHeight = 1123;
                customBox.style.display = 'none';
            } else if (val === '3:4') {
                svgWidth = 794; svgHeight = 1059;
                customBox.style.display = 'none';
            } else if (val === '1:1') {
                svgWidth = 1000; svgHeight = 1000;
                customBox.style.display = 'none';
            } else if (val === '4:3') {
                svgWidth = 1024; svgHeight = 768;
                customBox.style.display = 'none';
            } else if (val === '16:9') {
                svgWidth = 1280; svgHeight = 720;
                customBox.style.display = 'none';
            } else if (val === 'custom') {
                customBox.style.display = 'flex';
                svgWidth = parseInt(document.getElementById('customWidth').value) || 800;
                svgHeight = parseInt(document.getElementById('customHeight').value) || 1000;
            }

            wrapper.style.aspectRatio = `${svgWidth} / ${svgHeight}`;
            generatePuzzle();
        }

        // Desordenar las letras de una palabra manteniendo las longitudes (Anagrama individual por palabra)
        function scrambleWord(word) {
            word = word.trim().toUpperCase();
            if (word.length <= 1) return word;
            
            let arr = word.split('');
            let original = word;
            let attempts = 0;
            
            do {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                attempts++;
            } while (arr.join('') === original && attempts < 15);
            
            return arr.join(' ');
        }

        function generatePuzzle() {
            if (document.getElementById('dimensionSelect').value === 'custom') {
                svgWidth = parseInt(document.getElementById('customWidth').value) || 800;
                svgHeight = parseInt(document.getElementById('customHeight').value) || 1000;
                document.getElementById('canvasWrapper').style.aspectRatio = `${svgWidth} / ${svgHeight}`;
            }

            const title = document.getElementById('docTitle').value.trim();
            const subtitle = document.getElementById('docSubtitle').value.trim();
            const rawPhrases = document.getElementById('phraseInput').value;
            const phrases = rawPhrases.split('\n').map(p => p.trim()).filter(p => p.length > 0);

            const showTitle = document.getElementById('chkTitle').checked;
            const showSubtitle = document.getElementById('chkSubtitle').checked;
            const showName = document.getElementById('chkName').checked;
            const showDate = document.getElementById('chkDate').checked;
            const showClass = document.getElementById('chkClass').checked;

            let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${svgWidth} ${svgHeight}" width="100%" height="100%" style="background-color: white;">
                <defs>
                    <style>
                        .title { font-family: sans-serif; font-size: 26px; font-weight: bold; fill: #000; text-anchor: middle; }
                        .subtitle { font-family: sans-serif; font-size: 14px; fill: #555; text-anchor: middle; }
                        .header-text { font-family: sans-serif; font-size: 13px; fill: #000; }
                        .phrase-label { font-family: sans-serif; font-size: 14px; font-weight: bold; fill: #222; }
                        .scrambled-word { font-family: monospace; font-size: 16px; font-weight: bold; fill: #111; letter-spacing: 2px; }
                        .line { stroke: #000; stroke-width: 1.2; }
                    </style>
                </defs>`;

            let currentY = 45;

            // Título
            if (showTitle && title) {
                svg += `<text x="${svgWidth / 2}" y="${currentY}" class="title">${title}</text>`;
                currentY += 22;
            }

            // Subtítulo
            if (showSubtitle && subtitle) {
                svg += `<text x="${svgWidth / 2}" y="${currentY}" class="subtitle">${subtitle}</text>`;
                currentY += 25;
            } else if (!showTitle && !showSubtitle) {
                currentY = 30;
            }

            // Cabecera de datos (Nombre, Fecha, Aula) si al menos uno está activo
            if (showName || showDate || showClass) {
                let infoX = 50;
                if (showName) {
                    svg += `<text x="${infoX}" y="${currentY}" class="header-text">Nombre: _________________________</text>`;
                    infoX += 260;
                }
                if (showDate) {
                    svg += `<text x="${infoX}" y="${currentY}" class="header-text">Fecha: ____________</text>`;
                    infoX += 180;
                }
                if (showClass) {
                    svg += `<text x="${infoX}" y="${currentY}" class="header-text">Aula: ________</text>`;
                }
                currentY += 15;
                svg += `<line x1="50" y1="${currentY}" x2="${svgWidth - 50}" y2="${currentY}" class="line" />`;
                currentY += 35;
            } else {
                currentY += 10;
            }

            // Dibujar Frases tipo Criptograma
            const startY = currentY;
            const availableHeight = svgHeight - startY - 40;
            const phraseBlockHeight = phrases.length > 0 ? availableHeight / phrases.length : 100;

            phrases.forEach((phrase, phraseIndex) => {
                const pY = startY + (phraseIndex * phraseBlockHeight) + 20;
                
                // Número de frase
                svg += `<text x="50" y="${pY}" class="phrase-label">${phraseIndex + 1}.</text>`;

                const words = phrase.split(/\s+/);
                let cursorX = 85;
                let cursorY = pY;

                words.forEach(word => {
                    const scrambled = scrambleWord(word);
                    const letterSpacing = 22;
                    const wordWidth = word.length * letterSpacing + 15;

                    // Verificar desborde horizontal para pasar a la siguiente línea del bloque si es necesario
                    if (cursorX + wordWidth > svgWidth - 50) {
                        cursorX = 85;
                        cursorY += 42;
                    }

                    // Renderizar palabra desordenada arriba y guiones de respuesta abajo
                    svg += `<text x="${cursorX}" y="${cursorY}" class="scrambled-word">[ ${scrambled} ]</text>`;

                    // Líneas o casillas para completar la respuesta abajo de cada palabra desordenada
                    const lineY = cursorY + 18;
                    for (let i = 0; i < word.length; i++) {
                        const lx = cursorX + 5 + (i * 18);
                        svg += `<line x1="${lx}" y1="${lineY}" x2="${lx + 12}" y2="${lineY}" class="line" />`;
                    }

                    cursorX += wordWidth + 15;
                });
            });

            svg += `</svg>`;
            currentSVGData = svg;
            document.getElementById('canvasWrapper').innerHTML = svg;
        }

        function downloadFile(content, filename, type) {
            const blob = new Blob([content], { type: type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function exportSVG() {
            if (!currentSVGData) return;
            downloadFile(currentSVGData, 'anagramas_criptograma.svg', 'image/svg+xml');
        }

        function exportPNG() {
            if (!currentSVGData) return;

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // Escala 300 DPI (300 / 96 baseline ≈ 3.125)
            const scale = 3.125;
            canvas.width = svgWidth * scale;
            canvas.height = svgHeight * scale;

            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const img = new Image();
            const svgBlob = new Blob([currentSVGData], {type: 'image/svg+xml;charset=utf-8'});
            const url = URL.createObjectURL(svgBlob);

            img.onload = function () {
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                URL.revokeObjectURL(url);

                canvas.toBlob((blob) => {
                    const pngUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = pngUrl;
                    a.download = 'anagramas_criptograma_300dpi.png';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(pngUrl);
                }, 'image/png', 1.0);
            };
            img.src = url;
        }

        window.onload = generatePuzzle;
    </script>
</body>
</html>
