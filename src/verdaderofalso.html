<!DOCTYPE html> 
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador Verdadero o Falso</title>
<style>
/* CSS Reset y Tema Oscuro */
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }

body { background-color: #121212; color: #ffffff; display: flex; height: 100vh; overflow: hidden; }

/* Layout Principal - Panel lateral redimensionable */
.sidebar { 
    width: 450px; 
    min-width: 320px; 
    max-width: 60vw; 
    background-color: #1e1e1e; 
    display: flex; 
    flex-direction: column; 
    border-right: 1px solid #333; 
    z-index: 10; 
    resize: horizontal; 
    overflow: hidden;
    flex-shrink: 0;
}
.main-content { flex: 1; display: flex; flex-direction: column; position: relative; background-color: #121212; min-width: 0; }

/* Pestañas Horizontales */
.tabs-header { display: flex; background-color: #1e1e1e; border-bottom: 1px solid #333; flex-shrink: 0; }
.tab-btn { flex: 1; background: none; border: none; color: #aaa; padding: 15px 10px; cursor: pointer; transition: all 0.2s ease; white-space: nowrap; font-size: 20px; display: flex; align-items: center; justify-content: center; gap: 6px; }

.tab-btn:hover { color: #fff; background-color: #2a2a2a; }
.tab-btn.active { color: #3b82f6; border-bottom: 2px solid #3b82f6; background-color: #252525; }
.tab-content { display: none; flex: 1; overflow-y: auto; padding: 20px; }
.tab-content.active { display: block; }

/* Controles y Grupos */
.control-group { margin-bottom: 20px; background: #252525; padding: 15px; border-radius: 8px; border: 1px solid #333; }
.control-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.control-label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #eee; font-weight: 500; }

/* Inputs y Selects */
input[type="text"], input[type="number"], select { width: 100%; background: #333; border: 1px solid #444; color: #fff; padding: 8px 12px; border-radius: 4px; margin-top: 5px; outline: none; }
input[type="text"]:focus, select:focus { border-color: #3b82f6; }
input[type="range"] { width: 100%; margin-top: 8px; accent-color: #3b82f6; cursor: pointer; }

/* Switches (Interruptores) */
.switch { position: relative; display: inline-block; width: 36px; height: 18px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .3s; border-radius: 18px; }
.slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px; background-color: white; transition: .3s; border-radius: 50%; }
input:checked + .slider { background-color: #3b82f6; }
input:checked + .slider:before { transform: translateX(18px); }

/* Lista de Frases y Acciones */
.phrase-item { background: #333; padding: 12px; border-radius: 6px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #444; }
.phrase-text { font-size: 14px; word-break: break-word; line-height: 1.4; }
.phrase-actions { display: flex; justify-content: space-between; align-items: center; }
.vf-selector { display: flex; gap: 8px; background: #222; padding: 4px; border-radius: 6px; }
.vf-btn { padding: 4px 15px; border: none; background: transparent; color: #888; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s; }
.vf-btn.active.v { background: #10b981; color: #fff; }
.vf-btn.active.f { background: #ef4444; color: #fff; }

.action-buttons { display: flex; gap: 5px; }
.btn-icon { background: none; border: none; cursor: pointer; padding: 6px; opacity: 0.7; transition: 0.2s; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
.btn-icon:hover { opacity: 1; background: #444; }
.btn-icon.delete { color: #ef4444; }
.btn-icon.edit { color: #3b82f6; }
.btn-icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Botones Generales */
.btn { background: #3b82f6; color: #fff; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: 500; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; text-align: center; }
.btn:hover { background: #2563eb; }
.btn-success { background: #10b981; }
.btn-success:hover { background: #059669; }

/* Toolbar y Preview */
.toolbar { background: #1e1e1e; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; flex-shrink: 0; }
.preview-container { flex: 1; overflow: auto; padding: 30px; display: flex; justify-content: center; align-items: flex-start; }
#svg-preview { background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: width 0.3s, height 0.3s; display: block; }

/* Modales Compartidos */
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; }
.modal.active { display: flex; }
.modal-content { background: #1e1e1e; padding: 25px; border-radius: 8px; width: 450px; max-width: 90vw; border: 1px solid #333; text-align: left; }
.modal-title { margin-bottom: 10px; font-size: 18px; color: #fff; display: flex; align-items: center; gap: 8px; }
.modal-title svg { stroke: #3b82f6; }
.modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
.btn-cancel { grid-column: span 2; background: #444; }
.btn-cancel:hover { background: #555; }

/* Botones específicos de Modal */
.modal-btns-flex { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
.modal-btns-flex .btn { width: auto; }

/* Campos Personalizados */
#custom-dims { display: none; gap: 10px; margin-top: 10px; }

/* Botón Móvil Ver Preview */
.mobile-preview-btn { display: none; margin-top: 20px; background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
.mobile-preview-btn:hover { background: rgba(16, 185, 129, 0.3); }

/* RESPONSIVE DESIGN (Móviles y Tablets) */
@media (max-width: 768px) {
    body { flex-direction: column; }
    
    /* Panel lateral fijo arriba mostrando siempre la barra de pestañas */
    .sidebar { 
        width: 100% !important; 
        max-width: 100%; 
        height: auto; 
        max-height: none; 
        resize: none; 
        border-right: none; 
        border-bottom: 2px solid #333; 
        display: flex;
        flex-shrink: 0;
    }
    
    /* Control de visibilidad del Main Content en móviles */
    .main-content { 
        flex: 1; 
        display: flex;
        min-height: 0;
    }
    .main-content.hidden-mobile {
        display: none !important;
    }

    /* Ajuste de pestañas */
    .tab-content { max-height: calc(100vh - 40px); padding-bottom: 20px; } 

    .mobile-preview-btn { display: flex; }

    .preview-container { padding: 15px; }
    .toolbar { padding: 10px; flex-wrap: wrap; gap: 10px; }
    .toolbar .btn { width: auto; font-size: 13px; padding: 8px 12px; }
    .modal-btns .btn { font-size: 12px; padding: 8px; }
}
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
    <!-- Pestañas -->
    <div class="tabs-header">
        <button class="tab-btn active" id="btn-config" onclick="toggleTab('config', event)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
            Configuración
        </button>
        <button class="tab-btn" id="btn-frases" onclick="toggleTab('frases', event)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            Frases
        </button>
    </div>

    <!-- Pestaña: CONFIGURACIÓN -->
    <div id="config" class="tab-content active">
        <div class="control-group">
            <div class="control-header">
                <span class="control-label">Dimensiones (Hoja)</span>
            </div>
            <select id="dim-select" onchange="updateDimensions()">
                <option value="A4">A4 (794 x 1123)</option>
                <option value="3:4">3:4 (900 x 1200)</option>
                <option value="4:3">4:3 (1200 x 900)</option>
                <option value="1:1">1:1 (1000 x 1000)</option>
                <option value="custom">Personalizado</option>
            </select>
            <div id="custom-dims">
                <input type="number" id="dim-w" placeholder="Ancho (px)" oninput="renderSVG()">
                <input type="number" id="dim-h" placeholder="Alto (px)" oninput="renderSVG()">
            </div>
        </div>

        <div class="control-group">
            <div class="control-header">
                <span class="control-label">Título</span>
                <label class="switch"><input type="checkbox" id="show-title" checked onchange="renderSVG()"><span class="slider"></span></label>
            </div>
            <input type="text" id="val-title" value="VERDADERO O FALSO" oninput="renderSVG()">
            <label style="font-size:12px;color:#aaa;margin-top:8px;display:block;">Tamaño Título: <span id="lbl-size-title">28</span>px</label>
            <input type="range" id="size-title" min="16" max="60" value="28" oninput="document.getElementById('lbl-size-title').innerText=this.value; renderSVG()">
        </div>

        <div class="control-group">
            <div class="control-header">
                <span class="control-label">Subtítulo</span>
                <label class="switch"><input type="checkbox" id="show-subtitle" checked onchange="renderSVG()"><span class="slider"></span></label>
            </div>
            <input type="text" id="val-subtitle" value="Lee cada enunciado y marca con un círculo (V) si es verdadero o (F) si es falso." oninput="renderSVG()">
            <label style="font-size:12px;color:#aaa;margin-top:8px;display:block;">Tamaño Subtítulo: <span id="lbl-size-subtitle">16</span>px</label>
            <input type="range" id="size-subtitle" min="12" max="40" value="16" oninput="document.getElementById('lbl-size-subtitle').innerText=this.value; renderSVG()">
        </div>

        <div class="control-group">
            <div class="control-header">
                <span class="control-label">Encabezados (Datos del Alumno)</span>
            </div>
            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                <span style="font-size:13px;color:#ccc;">Nombre y Apellido</span>
                <label class="switch"><input type="checkbox" id="show-name" checked onchange="renderSVG()"><span class="slider"></span></label>
            </div>
            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                <span style="font-size:13px;color:#ccc;">Fecha</span>
                <label class="switch"><input type="checkbox" id="show-date" checked onchange="renderSVG()"><span class="slider"></span></label>
            </div>
            <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                <span style="font-size:13px;color:#ccc;">Aula</span>
                <label class="switch"><input type="checkbox" id="show-class" checked onchange="renderSVG()"><span class="slider"></span></label>
            </div>
            <label style="font-size:12px;color:#aaa;margin-top:8px;display:block;">Tamaño Encabezados: <span id="lbl-size-headers">14</span>px</label>
            <input type="range" id="size-headers" min="10" max="30" value="14" oninput="document.getElementById('lbl-size-headers').innerText=this.value; renderSVG()">
        </div>

        <button class="btn mobile-preview-btn" onclick="forceMobilePreview()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            Ver Vista Previa
        </button>
    </div>

    <!-- Pestaña: FRASES -->
    <div id="frases" class="tab-content">
        <div class="control-group">
            <div class="control-header">
                <span class="control-label">Apariencia de Lista</span>
            </div>
            <label style="font-size:12px;color:#aaa;display:block;">Tamaño de Frases: <span id="lbl-size-text">18</span>px</label>
            <input type="range" id="size-text" min="12" max="48" value="18" oninput="document.getElementById('lbl-size-text').innerText=this.value; renderSVG()">
            
            <label style="font-size:12px;color:#aaa;display:block;margin-top:15px;">Espaciado (Interlineado): <span id="lbl-spacing">50</span>px</label>
            <input type="range" id="spacing" min="20" max="150" value="50" oninput="document.getElementById('lbl-spacing').innerText=this.value; renderSVG()">

            <label style="font-size:12px;color:#aaa;display:block;margin-top:15px;">Separación entre (V) y (F): <span id="lbl-vf-gap">45</span>px</label>
            <input type="range" id="vf-gap" min="20" max="80" value="45" oninput="document.getElementById('lbl-vf-gap').innerText=this.value; renderSVG()">
        </div>

        <div class="control-group">
            <div class="control-header">
                <span class="control-label">Añadir Frase</span>
            </div>
            <input type="text" id="new-phrase" placeholder="Ej: La capital de Perú es Lima" onkeypress="if(event.key === 'Enter') addPhrase()">
            <button class="btn" style="margin-top:10px;" onclick="addPhrase()">Añadir a la lista</button>
        </div>

        <div id="phrase-list">
            <!-- Renderizado Dinámico -->
        </div>

        <button class="btn mobile-preview-btn" onclick="forceMobilePreview()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            Ver Vista Previa
        </button>
    </div>
</div>

<div class="main-content" id="main-content">
    <div class="toolbar">
        <div style="display:flex; align-items:center; gap: 10px;">
            <label class="switch" title="Mostrar Solución">
                <input type="checkbox" id="show-solution" onchange="renderSVG()">
                <span class="slider"></span>
            </label>
            <span style="font-size:14px; font-weight:bold; color: #fff;">Ver Solución</span>
        </div>
        <div>
            <button class="btn btn-success" onclick="openDownloadModal()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Descargar
            </button>
        </div>
    </div>
    <div class="preview-container">
        <!-- Preview SVG -->
        <div id="svg-preview"></div>
    </div>
</div>

<!-- Modal Descargar (2 Columnas) -->
<div class="modal" id="download-modal">
    <div class="modal-content">
        <h3 class="modal-title" style="justify-content:center;">Opciones de Descarga</h3>
        <p style="font-size:13px; color:#aaa; margin-bottom:20px; text-align:center;">Alta resolución a 300 DPI.</p>
        <div class="modal-btns">
            <button class="btn btn-success" onclick="download('png', false)">Ejercicio (PNG)</button>
            <button class="btn btn-success" onclick="download('svg', false)">Ejercicio (SVG)</button>
            <button class="btn" style="background:#ef4444;" onclick="download('png', true)">Solución (PNG)</button>
            <button class="btn" style="background:#ef4444;" onclick="download('svg', true)">Solución (SVG)</button>
            <button class="btn btn-cancel" onclick="closeModal('download-modal')">Cancelar</button>
        </div>
    </div>
</div>

<!-- Modal Editar Frase -->
<div class="modal" id="edit-modal">
    <div class="modal-content">
        <h3 class="modal-title">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            Editar Frase
        </h3>
        <div style="margin-top: 15px;">
            <input type="text" id="edit-phrase-input" placeholder="Escribe tu frase aquí..." onkeypress="if(event.key === 'Enter') saveEditPhrase()">
        </div>
        <div class="modal-btns-flex">
            <button class="btn" style="background:#444;" onclick="closeModal('edit-modal')">Cancelar</button>
            <button class="btn" onclick="saveEditPhrase()">Guardar</button>
        </div>
    </div>
</div>

<script>
// Estado Inicial
let frasesList = [
    { id: 1, text: "La Tierra es el tercer planeta del sistema solar.", answer: 'V' },
    { id: 2, text: "El agua hierve a 50 grados Celsius a nivel del mar.", answer: 'F' }
];

let editingId = null;

// Gestión de Pestañas y Vista Móvil
function toggleTab(tabId, event) {
    const btn = event.currentTarget;
    const content = document.getElementById(tabId);
    
    // Si la pestaña actual ya está activa, la contraemos
    if (btn.classList.contains('active')) {
        btn.classList.remove('active');
        content.classList.remove('active');
        updateMobileVisibility(); 
    } else {
        // Contraemos todas y expandimos la seleccionada
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        content.classList.add('active');
        updateMobileVisibility();
    }
}

// Fuerza a cerrar los menús para ver la vista previa (Móvil)
function forceMobilePreview() {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    updateMobileVisibility();
}

// Determina qué mostrar en móvil basado en si hay una pestaña abierta
function updateMobileVisibility() {
    if (window.innerWidth <= 768) {
        const isActive = document.querySelector('.tab-content.active') !== null;
        const mainContent = document.getElementById('main-content');

        if (isActive) {
            // Mostrar formulario completo, ocultar preview
            mainContent.classList.add('hidden-mobile');
        } else {
            // Mostrar preview, manteniendo la cabecera de pestañas fija arriba
            mainContent.classList.remove('hidden-mobile');
        }
    }
}

// Chequear resize para arreglar vistas
window.addEventListener('resize', () => {
    renderSVG();
    if(window.innerWidth > 768) {
        document.getElementById('main-content').classList.remove('hidden-mobile');
        
        // Si no hay ninguna pestaña abierta, abrimos configuración por defecto en desktop
        if(!document.querySelector('.tab-content.active')) {
            document.getElementById('btn-config').classList.add('active');
            document.getElementById('config').classList.add('active');
        }
    } else {
        updateMobileVisibility();
    }
});


// Configuración de Dimensiones
const dimPresets = { 'A4': {w: 794, h: 1123}, '3:4': {w: 900, h: 1200}, '4:3': {w: 1200, h: 900}, '1:1': {w: 1000, h: 1000} };
let currentW = 794;
let currentH = 1123;

function updateDimensions() {
    const val = document.getElementById('dim-select').value;
    const customDiv = document.getElementById('custom-dims');
    if (val === 'custom') {
        customDiv.style.display = 'flex';
        currentW = parseInt(document.getElementById('dim-w').value) || 794;
        currentH = parseInt(document.getElementById('dim-h').value) || 1123;
    } else {
        customDiv.style.display = 'none';
        currentW = dimPresets[val].w;
        currentH = dimPresets[val].h;
    }
    renderSVG();
}

document.getElementById('dim-w').addEventListener('input', updateDimensions);
document.getElementById('dim-h').addEventListener('input', updateDimensions);

// Gestión Lógica de Frases
function addPhrase() {
    const input = document.getElementById('new-phrase');
    const text = input.value.trim();
    if (text) {
        frasesList.push({ id: Date.now(), text: text, answer: 'V' });
        input.value = '';
        renderPhraseList();
        renderSVG();
    }
}

function deletePhrase(id) {
    frasesList = frasesList.filter(p => p.id !== id);
    renderPhraseList();
    renderSVG();
}

function openEditModal(id) {
    const p = frasesList.find(item => item.id === id);
    if (p) {
        editingId = id;
        const input = document.getElementById('edit-phrase-input');
        input.value = p.text;
        document.getElementById('edit-modal').classList.add('active');
        setTimeout(() => input.focus(), 100);
    }
}

function saveEditPhrase() {
    const newText = document.getElementById('edit-phrase-input').value.trim();
    if (newText !== "" && editingId) {
        const p = frasesList.find(item => item.id === editingId);
        if (p) {
            p.text = newText;
            renderPhraseList();
            renderSVG();
        }
    }
    closeModal('edit-modal');
}

function setAnswer(id, ans) {
    const f = frasesList.find(p => p.id === id);
    if (f) {
        f.answer = ans;
        renderPhraseList();
        renderSVG();
    }
}

function renderPhraseList() {
    const list = document.getElementById('phrase-list');
    list.innerHTML = '';
    frasesList.forEach(p => {
        const div = document.createElement('div');
        div.className = 'phrase-item';
        div.innerHTML = `
            <div class="phrase-text">${p.text}</div>
            <div class="phrase-actions">
                <div class="vf-selector">
                    <button class="vf-btn v ${p.answer === 'V' ? 'active' : ''}" onclick="setAnswer(${p.id}, 'V')">V</button>
                    <button class="vf-btn f ${p.answer === 'F' ? 'active' : ''}" onclick="setAnswer(${p.id}, 'F')">F</button>
                </div>
                <div class="action-buttons">
                    <button class="btn-icon edit" onclick="openEditModal(${p.id})" title="Editar Frase">
                        <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                    </button>
                    <button class="btn-icon delete" onclick="deletePhrase(${p.id})" title="Eliminar Frase">
                        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path></svg>
                    </button>
                </div>
            </div>
        `;
        list.appendChild(div);
    });
}

// Lógica para medir y hacer salto de línea en SVG
const ctx = document.createElement('canvas').getContext('2d');
function measureText(text, fontSize, fontFace = 'Arial') {
    ctx.font = `${fontSize}px ${fontFace}`;
    return ctx.measureText(text).width;
}

function wrapText(text, maxWidth, fontSize) {
    const words = text.split(' ');
    const lines = [];
    let currentLine = words[0] || '';

    for (let i = 1; i < words.length; i++) {
        const word = words[i];
        const width = measureText(currentLine + " " + word, fontSize);
        if (width < maxWidth) {
            currentLine += " " + word;
        } else {
            lines.push(currentLine);
            currentLine = word;
        }
    }
    if (currentLine) lines.push(currentLine);
    return lines;
}

// Motor de Renderizado del Documento (SVG)
function getSVGContent(isSolution) {
    const sTitle = parseInt(document.getElementById('size-title').value);
    const sSubtitle = parseInt(document.getElementById('size-subtitle').value);
    const sHeaders = parseInt(document.getElementById('size-headers').value);
    const sText = parseInt(document.getElementById('size-text').value);
    const spacing = parseInt(document.getElementById('spacing').value);
    const vfGap = parseInt(document.getElementById('vf-gap').value);
    
    const showTitle = document.getElementById('show-title').checked;
    const showSubtitle = document.getElementById('show-subtitle').checked;
    const showName = document.getElementById('show-name').checked;
    const showDate = document.getElementById('show-date').checked;
    const showClass = document.getElementById('show-class').checked;
    
    const titleTxt = document.getElementById('val-title').value;
    const subtitleTxt = document.getElementById('val-subtitle').value;

    const marginX = 60;
    let y = 60;
    const totalVfWidth = 90 + vfGap; 
    const maxTextWidth = currentW - (marginX * 2) - totalVfWidth - 10; 

    let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${currentW} ${currentH}" width="${currentW}" height="${currentH}" style="background-color: white;">`;
    svg += `<style>
        .t { font-family: 'Segoe UI', Arial, sans-serif; fill: #000; }
        .b { font-weight: bold; }
        .correct-circle { stroke: #ef4444; stroke-width: 2.5; fill: none; }
    </style>`;

    if(showName || showDate || showClass) {
        y += sHeaders;
        let headerHtml = '';
        if(showName) headerHtml += `<tspan x="${marginX}" dy="0">Nombre: _________________________________________</tspan>`;
        if(showDate) headerHtml += `<tspan x="${currentW - marginX - measureText('Fecha: ______________', sHeaders)}" dy="0">Fecha: ______________</tspan>`;
        svg += `<text class="t" font-size="${sHeaders}" y="${y}">${headerHtml}</text>`;
        
        if(showClass) {
            y += sHeaders + 20;
            svg += `<text class="t" font-size="${sHeaders}" y="${y}" x="${marginX}">Aula: ________________</text>`;
        }
        y += 40;
    }

    if (showTitle) {
        y += sTitle;
        const tw = measureText(titleTxt, sTitle, 'bold Arial');
        svg += `<text class="t b" font-size="${sTitle}" x="${(currentW - tw)/2}" y="${y}">${titleTxt}</text>`;
        y += 20;
    }

    if (showSubtitle) {
        y += sSubtitle;
        const tw = measureText(subtitleTxt, sSubtitle, 'Arial');
        svg += `<text class="t" font-size="${sSubtitle}" x="${(currentW - tw)/2}" y="${y}">${subtitleTxt}</text>`;
        y += 30;
    }

    y += 20; 

    frasesList.forEach((p, index) => {
        const lines = wrapText(`${index + 1}. ${p.text}`, maxTextWidth, sText);
        
        lines.forEach((line) => {
            y += sText + 10; 
            svg += `<text class="t" font-size="${sText}" x="${marginX}" y="${y}">${line}</text>`;
        });

        const vfY = y; 
        const fX = currentW - marginX - 45;
        const vX = fX - vfGap;

        svg += `<text class="t b" font-size="${sText}" x="${vX}" y="${vfY}">( V )</text>`;
        svg += `<text class="t b" font-size="${sText}" x="${fX}" y="${vfY}">( F )</text>`;

        if (isSolution) {
            const circleRadius = sText * 0.9;
            const cy = vfY - (sText * 0.35); 
            
            if (p.answer === 'V') {
                const cx = vX + measureText('( V )', sText, 'bold Arial') / 2;
                svg += `<circle cx="${cx}" cy="${cy}" r="${circleRadius}" class="correct-circle"/>`;
            } else {
                const cx = fX + measureText('( F )', sText, 'bold Arial') / 2;
                svg += `<circle cx="${cx}" cy="${cy}" r="${circleRadius}" class="correct-circle"/>`;
            }
        }
        y += spacing;
    });

    svg += `</svg>`;
    return svg;
}

function renderSVG() {
    const isSolution = document.getElementById('show-solution').checked;
    const svgStr = getSVGContent(isSolution);
    const container = document.getElementById('svg-preview');
    container.innerHTML = svgStr;
    
    const svgEl = container.querySelector('svg');
    const parentW = container.parentElement.clientWidth - 60;
    
    if(currentW > parentW) {
        svgEl.style.width = parentW + 'px';
        svgEl.style.height = 'auto';
    } else {
        svgEl.style.width = currentW + 'px';
        svgEl.style.height = currentH + 'px';
    }
}

// Modales genéricos
function openDownloadModal() { 
    document.getElementById('download-modal').classList.add('active'); 
}
function closeModal(id) { 
    document.getElementById(id).classList.remove('active'); 
    editingId = null;
}

function download(format, isSolution) {
    const svgStr = getSVGContent(isSolution);
    const blob = new Blob([svgStr], {type: 'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const filename = `verdadero_falso_${isSolution ? 'solucion' : 'ejercicio'}.${format}`;

    if (format === 'svg') {
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    } else if (format === 'png') {
        const img = new Image();
        img.onload = () => {
            const scale = 4;
            const canvas = document.createElement('canvas');
            canvas.width = currentW * scale;
            canvas.height = currentH * scale;
            const ctx = canvas.getContext('2d');
            ctx.scale(scale, scale);
            
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, currentW, currentH);
            ctx.drawImage(img, 0, 0, currentW, currentH);
            
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        };
        img.src = url;
    }
    closeModal('download-modal');
}

// Inicialización
renderPhraseList();
updateDimensions();
updateMobileVisibility();

    document.addEventListener('keydown', function(e) {
        // Bloquear F12
        if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault();
            return false;
        }
        
        // Bloquear Ctrl+Shift+I (Inspeccionar), Ctrl+Shift+J (Consola), Ctrl+Shift+C (Seleccionar elemento)
        if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) {
            e.preventDefault();
            return false;
        }
        
        // Bloquear Ctrl+U (Ver código fuente) y Ctrl+S (Guardar página)
        if (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's')) {
            e.preventDefault();
            return false;
        }
    });
</script>
