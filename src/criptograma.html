<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Criptogramas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b1329;
        }
        
        /* Animación suave para la aparición de elementos */
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Contenedor del SVG para la previsualización */
        #svg-preview-container svg, #svg-key-container svg {
            width: 100%;
            height: auto;
            border-radius: 0.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        /* Estilo para sliders en tema oscuro */
        input[type=range] {
            accent-color: #6366f1;
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 p-4 sm:p-8">

    <main class="max-w-4xl mx-auto">
        <!-- Encabezado -->
        <header class="text-center mb-8">
            <div class="inline-flex items-center justify-center p-3 bg-indigo-600/90 rounded-full mb-4 shadow-lg shadow-indigo-500/20">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">Generador de Criptogramas</h1>
            <p class="text-slate-400">Ingresa una frase para crear un rompecabezas de sustitución aleatoria. Listo para imprimir.</p>
        </header>

        <!-- Tarjeta Principal de Controles con Pestañas Horizontales y Colapsable -->
        <div class="bg-slate-900 rounded-xl shadow-xl p-6 mb-8 border border-slate-800">
            
            <!-- Barra Superior de Pestañas Horizontales + Botón Colapsar -->
            <div class="flex flex-wrap items-center justify-between border-b border-slate-800 pb-4 mb-5 gap-3">
                <!-- Pestañas Horizontales de Formularios -->
                <div class="flex items-center gap-2 bg-slate-950 p-1.5 rounded-lg border border-slate-800/80">
                    <button id="tab-btn-phrase" onclick="app.switchFormTab('phrase')" 
                        class="px-4 py-2 rounded-md text-xs sm:text-sm font-semibold transition-all flex items-center gap-2 bg-indigo-600 text-white shadow">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                        Frase Oculta
                    </button>
                    <button id="tab-btn-custom" onclick="app.switchFormTab('custom')" 
                        class="px-4 py-2 rounded-md text-xs sm:text-sm font-semibold transition-all flex items-center gap-2 text-slate-400 hover:text-white hover:bg-slate-800">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                        Personalización
                    </button>
                </div>

                <!-- Botón Desplegable / Colapsable -->
                <button id="btn-collapse-form" onclick="app.toggleFormCollapse()" 
                    class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 border border-slate-700 transition-colors flex items-center gap-1.5 ml-auto">
                    <span id="collapse-icon">▲</span>
                    <span id="collapse-text">Colapsar Opciones</span>
                </button>
            </div>

            <!-- Contenedor Colapsable del Formulario -->
            <div id="form-body-container" class="transition-all duration-300">
                
                <!-- Pestaña 1: Entrada de Frase -->
                <div id="form-tab-phrase" class="fade-in">
                    <label for="input-phrase" class="block text-sm font-semibold text-slate-300 mb-2">Frase o mensaje oculto:</label>
                    <textarea id="input-phrase" rows="4" 
                        class="w-full px-4 py-3 rounded-lg bg-slate-950 border border-slate-700 text-slate-100 placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors resize-none text-lg mb-4"
                        placeholder="Ejemplo: El conocimiento es poder."></textarea>
                </div>

                <!-- Pestaña 2: Personalización de Tamaños y Espaciados -->
                <div id="form-tab-custom" class="hidden fade-in">
                    <div class="bg-slate-950/70 rounded-xl p-4 mb-4 border border-slate-800">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-indigo-400 mb-4 flex items-center gap-2">
                            Ajustes del Rompecabezas (3:4) y Clave de Cifrado (16:9)
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">Tamaño Números Puzzle: <span id="val-puzzle-font" class="font-bold text-indigo-400">60</span></label>
                                <input type="range" id="input-puzzle-font" min="40" max="90" value="60" oninput="app.updateParam('puzzleFontSize', this.value)" class="w-full">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">Ancho Caracter Puzzle: <span id="val-puzzle-width" class="font-bold text-indigo-400">70</span></label>
                                <input type="range" id="input-puzzle-width" min="50" max="100" value="70" oninput="app.updateParam('puzzleCharWidth', this.value)" class="w-full">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">Tamaño Fuente Clave: <span id="val-key-font" class="font-bold text-indigo-400">64</span></label>
                                <input type="range" id="input-key-font" min="40" max="90" value="64" oninput="app.updateParam('keyFontSize', this.value)" class="w-full">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">Espaciado Celda Clave: <span id="val-key-col" class="font-bold text-indigo-400">420</span></label>
                                <input type="range" id="input-key-col" min="320" max="550" value="420" oninput="app.updateParam('keyColWidth', this.value)" class="w-full">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Mensaje de Error -->
                <div id="error-message" class="hidden bg-red-950/80 text-red-300 px-4 py-3 rounded-lg mb-4 text-sm font-medium border border-red-800">
                    Por favor, ingresa al menos una palabra para generar el criptograma.
                </div>

                <!-- Botón Principal Generar -->
                <div class="flex justify-end pt-2">
                    <button id="btn-generate" onclick="app.generate()" 
                        class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-8 rounded-lg shadow-lg shadow-indigo-600/30 transition-all transform hover:scale-[1.01] active:scale-95 flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                        Generar Criptograma
                    </button>
                </div>

            </div>
        </div>

        <!-- Contenedor de Previsualizaciones (Lienzos por Pestañas) -->
        <div id="result-section" class="hidden fade-in space-y-6">
            
            <div class="bg-slate-900 rounded-xl shadow-xl p-6 border border-slate-800">
                
                <!-- Pestañas Horizontales para Lienzos / Previews -->
                <div class="flex flex-wrap items-center justify-between border-b border-slate-800 pb-4 mb-6 gap-3">
                    <div class="flex items-center gap-2 bg-slate-950 p-1.5 rounded-lg border border-slate-800/80">
                        <button id="tab-preview-btn-puzzle" onclick="app.switchPreviewTab('puzzle')" 
                            class="px-4 py-2 rounded-md text-xs sm:text-sm font-semibold transition-all flex items-center gap-2 bg-indigo-600 text-white shadow">
                            🧩 Rompecabezas (3:4)
                        </button>
                        <button id="tab-preview-btn-key" onclick="app.switchPreviewTab('key')" 
                            class="px-4 py-2 rounded-md text-xs sm:text-sm font-semibold transition-all flex items-center gap-2 text-slate-400 hover:text-white hover:bg-slate-800">
                            🔑 Clave de Cifrado (16:9)
                        </button>
                    </div>

                    <!-- Botones de Exportación Dinámicos -->
                    <div id="puzzle-export-actions" class="flex flex-wrap gap-2">
                        <button id="btn-export-svg" onclick="app.exportSVG(app.currentSvgString, 'criptograma.svg')" disabled
                            class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-2 px-4 rounded-lg border border-slate-700 shadow-sm transition-colors disabled:opacity-50 text-xs sm:text-sm flex items-center gap-1.5">
                            <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            SVG
                        </button>
                        <button id="btn-export-png" onclick="app.exportPNG(app.currentSvgString, app.puzzleWidth, app.puzzleHeight, 'criptograma_300dpi.png', 'btn-export-png')" disabled
                            class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-2 px-4 rounded-lg border border-slate-700 shadow-sm transition-colors disabled:opacity-50 text-xs sm:text-sm flex items-center gap-1.5">
                            <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            PNG 300DPI
                        </button>
                    </div>

                    <div id="key-export-actions" class="hidden flex flex-wrap gap-2">
                        <button id="btn-export-key-svg" onclick="app.exportSVG(app.currentKeySvgString, 'clave_criptograma.svg')" 
                            class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-2 px-4 rounded-lg border border-slate-700 shadow-sm transition-colors text-xs sm:text-sm flex items-center gap-1.5">
                            <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            Clave (SVG)
                        </button>
                        <button id="btn-export-key-png" onclick="app.exportPNG(app.currentKeySvgString, app.keyWidth, app.keyHeight, 'clave_criptograma_300dpi.png', 'btn-export-key-png')"
                            class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-2 px-4 rounded-lg border border-slate-700 shadow-sm transition-colors text-xs sm:text-sm flex items-center gap-1.5">
                            <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            Clave (PNG 300DPI)
                        </button>
                    </div>
                </div>

                <!-- Lienzo Pestaña 1: Rompecabezas (Ratio 3:4) -->
                <div id="preview-tab-puzzle" class="fade-in">
                    <div id="svg-preview-container" class="w-full flex justify-center bg-slate-950 rounded-lg p-2 border border-slate-800">
                        <!-- El SVG generado se inyectará aquí -->
                    </div>
                </div>

                <!-- Lienzo Pestaña 2: Clave de Cifrado (Ratio 16:9) -->
                <div id="preview-tab-key" class="hidden fade-in">
                    <div id="svg-key-container" class="w-full flex justify-center bg-slate-950 rounded-lg p-2 border border-slate-800">
                        <!-- El SVG de la clave se inyectará aquí -->
                    </div>
                </div>

            </div>

        </div>

    </main>

    <script>
        const app = {
            alphabet: "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split(''),
            currentSvgString: '',
            currentKeySvgString: '',
            currentCipherMap: {},
            isFormCollapsed: false,
            
            // Parámetros personalizables iniciales
            puzzleFontSize: 60,
            puzzleCharWidth: 70,
            keyFontSize: 64,
            keyColWidth: 420,

            // Resoluciones nativas de alta calidad (DPI equivalente ~300)
            puzzleWidth: 2400,
            puzzleHeight: 3200, // Ratio 3:4 (Aprox 8x10.6 pulgadas)
            keyWidth: 2400,
            keyHeight: 1350,    // Ratio 16:9 Horizontal

            // Cambiar Pestañas de Formulario
            switchFormTab(tabName) {
                const phraseTab = document.getElementById('form-tab-phrase');
                const customTab = document.getElementById('form-tab-custom');
                const btnPhrase = document.getElementById('tab-btn-phrase');
                const btnCustom = document.getElementById('tab-btn-custom');

                if (tabName === 'phrase') {
                    phraseTab.classList.remove('hidden');
                    customTab.classList.add('hidden');
                    btnPhrase.className = "px-4 py-2 rounded-md text-xs sm:text-sm font-semibold transition-all flex items-center gap-2 bg-indigo-600 text-white shadow";
                    btnCustom.className = "px-4 py-2 rounded-md text-xs sm:text-sm font-semibold transition-all flex items-center gap-2 text-slate-400 hover:text-white hover:bg-slate-800";
                } else {
                    phraseTab.classList.add('hidden');
                    customTab.classList.remove('hidden');
                    btnCustom.className = "px-4 py-2 rounded-md text-xs sm:text-sm font-semibold transition-all flex items-center gap-2 bg-indigo-600 text-white shadow";
                    btnPhrase.className = "px-4 py-2 rounded-md text-xs sm:text-sm font-semibold transition-all flex items-center gap-2 text-slate-400 hover:text-white hover:bg-slate-800";
                }
            },

            // Colapsar/Desplegar Formulario
            toggleFormCollapse() {
                const body = document.getElementById('form-body-container');
                const icon = document.getElementById('collapse-icon');
                const text = document.getElementById('collapse-text');

                this.isFormCollapsed = !this.isFormCollapsed;

                if (this.isFormCollapsed) {
                    body.classList.add('hidden');
                    icon.innerText = '▼';
                    text.innerText = 'Desplegar Opciones';
                } else {
                    body.classList.remove('hidden');
                    icon.innerText = '▲';
                    text.innerText = 'Colapsar Opciones';
                }
            },

            // Cambiar Pestañas de Previsualización (Lienzos)
            switchPreviewTab(tabName) {
                const puzzleTab = document.getElementById('preview-tab-puzzle');
                const keyTab = document.getElementById('preview-tab-key');
                const btnPuzzle = document.getElementById('tab-preview-btn-puzzle');
                const btnKey = document.getElementById('tab-preview-btn-key');
                const puzzleActions = document.getElementById('puzzle-export-actions');
                const keyActions = document.getElementById('key-export-actions');

                if (tabName === 'puzzle') {
                    puzzleTab.classList.remove('hidden');
                    keyTab.classList.add('hidden');
                    puzzleActions.classList.remove('hidden');
                    keyActions.classList.add('hidden');
                    btnPuzzle.className = "px-4 py-2 rounded-md text-xs sm:text-sm font-semibold transition-all flex items-center gap-2 bg-indigo-600 text-white shadow";
                    btnKey.className = "px-4 py-2 rounded-md text-xs sm:text-sm font-semibold transition-all flex items-center gap-2 text-slate-400 hover:text-white hover:bg-slate-800";
                } else {
                    puzzleTab.classList.add('hidden');
                    keyTab.classList.remove('hidden');
                    puzzleActions.classList.add('hidden');
                    keyActions.classList.remove('hidden');
                    btnKey.className = "px-4 py-2 rounded-md text-xs sm:text-sm font-semibold transition-all flex items-center gap-2 bg-indigo-600 text-white shadow";
                    btnPuzzle.className = "px-4 py-2 rounded-md text-xs sm:text-sm font-semibold transition-all flex items-center gap-2 text-slate-400 hover:text-white hover:bg-slate-800";
                }
            },

            updateParam(param, val) {
                this[param] = parseInt(val);
                if (param === 'puzzleFontSize') document.getElementById('val-puzzle-font').innerText = val;
                if (param === 'puzzleCharWidth') document.getElementById('val-puzzle-width').innerText = val;
                if (param === 'keyFontSize') document.getElementById('val-key-font').innerText = val;
                if (param === 'keyColWidth') document.getElementById('val-key-col').innerText = val;

                // Re-generar automáticamente si ya hay un resultado visible
                if (!document.getElementById('result-section').classList.contains('hidden')) {
                    const input = document.getElementById('input-phrase').value.trim();
                    if (input) {
                        const normalizedInput = this.normalizeText(input);
                        this.buildSVG(normalizedInput, this.currentCipherMap);
                        this.buildKeySVG(this.currentCipherMap);
                    }
                }
            },

            // Normalización de Texto (Quitar acentos, dejar caracteres estándar españoles)
            normalizeText(text) {
                return text.toUpperCase()
                    .replace(/[ÁÄÂÀ]/g, 'A')
                    .replace(/[ÉËÊÈ]/g, 'E')
                    .replace(/[ÍÏÎÌ]/g, 'I')
                    .replace(/[ÓÖÔÒ]/g, 'O')
                    .replace(/[ÚÜÛÙ]/g, 'U');
            },

            // Generar sustitución aleatoria por números únicos del 1 al 27
            generateCipherMap() {
                let numbers = Array.from({length: this.alphabet.length}, (_, i) => (i + 1).toString());
                for (let i = numbers.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
                }

                let map = {};
                this.alphabet.forEach((char, i) => { map[char] = numbers[i]; });
                this.currentCipherMap = map;
                return map;
            },

            showError(show) {
                const errorBox = document.getElementById('error-message');
                if (show) {
                    errorBox.classList.remove('hidden');
                } else {
                    errorBox.classList.add('hidden');
                }
            },

            generate() {
                const input = document.getElementById('input-phrase').value.trim();
                if (!input) {
                    this.showError(true);
                    return;
                }
                this.showError(false);

                const normalizedInput = this.normalizeText(input);
                const cipherMap = this.generateCipherMap();
                
                this.buildSVG(normalizedInput, cipherMap);
                this.buildKeySVG(cipherMap);
                
                // Actualizar Interfaz
                document.getElementById('result-section').classList.remove('hidden');
                document.getElementById('btn-export-svg').disabled = false;
                document.getElementById('btn-export-png').disabled = false;
            },

            buildSVG(text, map) {
                // Configuraciones de Diseño Escaladas para 2400x3200 (Ratio 3:4)
                const padX = 160;
                const padY = 240;
                const maxWidth = this.puzzleWidth - padX; 
                
                const charWidth = this.puzzleCharWidth;  
                const charSpace = Math.round(charWidth * 0.35);   
                const wordSpace = Math.round(charWidth * 1.3);  
                const rowHeight = 300;  

                let x = padX;
                let y = padY;
                let svgContent = '';

                // Dividimos preservando puntuaciones como "palabras" si están unidas
                const words = text.split(/(\s+)/); 

                words.forEach(word => {
                    if (word.trim() === '') {
                        if (word.includes('\n')) {
                            x = padX;
                            y += rowHeight;
                        } else {
                            x += wordSpace;
                        }
                        return;
                    }

                    const wordWidth = word.length * (charWidth + charSpace);

                    // Salto de línea por palabra completa (Word-wrap)
                    if (x + wordWidth > maxWidth && x > padX) {
                        x = padX;
                        y += rowHeight;
                    }

                    for (let i = 0; i < word.length; i++) {
                        const char = word[i];
                        const isLetter = this.alphabet.includes(char);

                        // Salto si el caracter individual excede el límite del canvas
                        if (x + charWidth > maxWidth) {
                            x = padX;
                            y += rowHeight;
                        }

                        if (isLetter) {
                            const cipherNum = map[char];
                            // Línea base para escribir la letra (ARRIBA)
                            svgContent += `<line x1="${x}" y1="${y}" x2="${x + charWidth}" y2="${y}" stroke="#4b5563" stroke-width="5" />`;
                            // Número cifrado (ABAJO) con tamaño dinámico
                            svgContent += `<text x="${x + (charWidth/2)}" y="${y + 10 + (this.puzzleFontSize * 0.8)}" text-anchor="middle" font-family="Arial, sans-serif" font-size="${this.puzzleFontSize}" font-weight="bold" fill="#1f2937">${cipherNum}</text>`;
                        } else {
                            // Puntuación: se dibuja sobre la línea base
                            svgContent += `<text x="${x + (charWidth/2)}" y="${y - 10}" text-anchor="middle" font-family="Arial, sans-serif" font-size="${this.puzzleFontSize}" font-weight="bold" fill="#1f2937">${char}</text>`;
                        }

                        x += charWidth + charSpace;
                    }
                });

                this.currentSvgString = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${this.puzzleWidth} ${this.puzzleHeight}" width="${this.puzzleWidth}" height="${this.puzzleHeight}">
    <rect width="100%" height="100%" fill="#ffffff" />
    ${svgContent}
</svg>`;
                document.getElementById('svg-preview-container').innerHTML = this.currentSvgString;
            },

            buildKeySVG(map) {
                let svgContent = '';
                const cols = 7;
                const cellWidth = this.keyColWidth; 
                const cellHeight = Math.round(this.keyColWidth * 0.75); 
                
                // Centrar la cuadrícula de 7 columnas en el lienzo de 2400x1350 (Ratio 16:9)
                const gridTotalWidth = (cols - 1) * cellWidth; 
                const startX = (this.keyWidth - gridTotalWidth) / 2;
                const startY = 360; 

                this.alphabet.forEach((char, index) => {
                    const col = index % cols;
                    const row = Math.floor(index / cols);
                    const x = startX + (col * cellWidth);
                    const y = startY + (row * cellHeight);

                    const num = map[char];
                    
                    const rectWidth = Math.round(this.keyFontSize * 2.8);
                    const rectHeight = Math.round(this.keyFontSize * 1.35);
                    const rectX = x - (rectWidth / 2);
                    const rectY = y - (rectHeight / 2) - Math.round(this.keyFontSize * 0.1);
                    
                    svgContent += `<rect x="${rectX}" y="${rectY}" width="${rectWidth}" height="${rectHeight}" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3" />`;
                    
                    svgContent += `<text x="${x}" y="${y + Math.round(this.keyFontSize * 0.3)}" text-anchor="middle" font-family="monospace, Arial, sans-serif" font-size="${this.keyFontSize}" font-weight="bold" fill="#1e293b">${char}<tspan fill="#94a3b8" font-size="${Math.round(this.keyFontSize * 0.8)}">= </tspan><tspan fill="#2563eb">${num}</tspan></text>`;
                });

                // Título
                svgContent += `<text x="${this.keyWidth/2}" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#0f172a">CLAVE DE CIFRADO (SOLUCIONARIO)</text>`;

                this.currentKeySvgString = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${this.keyWidth} ${this.keyHeight}" width="${this.keyWidth}" height="${this.keyHeight}">
    <rect width="100%" height="100%" fill="#ffffff" />
    ${svgContent}
</svg>`;
                document.getElementById('svg-key-container').innerHTML = this.currentKeySvgString;
            },

            exportSVG(svgString, filename) {
                if (!svgString) return;
                
                const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.href = url;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                setTimeout(() => URL.revokeObjectURL(url), 100);
            },

            exportPNG(svgString, baseWidth, baseHeight, filename, btnId) {
                if (!svgString) return;

                const btn = document.getElementById(btnId);
                const originalText = btn.innerHTML;
                btn.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-current" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Procesando...`;
                btn.disabled = true;

                const canvas = document.createElement('canvas');
                canvas.width = baseWidth;
                canvas.height = baseHeight;
                const ctx = canvas.getContext('2d');

                const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(svgBlob);

                const img = new Image();
                img.onload = () => {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);

                    const link = document.createElement('a');
                    link.download = filename;
                    link.href = canvas.toDataURL('image/png');
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    URL.revokeObjectURL(url);
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                };
                img.src = url;
            }
        };
    </script>
    <script>
        // Bloquear clic derecho (Anticlic)
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // Bloquear atajos de teclado de desarrollador
        document.addEventListener('keydown', function(e) {
            // Bloquear F12
            if (e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault();
                return false;
            }
            
            // Bloquear Ctrl+Shift+I, J, C
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) {
                e.preventDefault();
                return false;
            }
            
            // Bloquear Ctrl+U y Ctrl+S
            if (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's')) {
                e.preventDefault();
                return false;
            }
        });
    </script>
</body>
