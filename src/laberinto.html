<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Laberintos Avanzado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .touch-none {
            touch-action: none;
        }
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937; 
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563; 
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280; 
        }
        
        /* Ocultar el panel de tabs en movil por defecto, mostrar en md */
        @media (min-width: 768px) {
            #tabsContainer {
                display: flex !important;
            }
        }
    </style>
</head>
<body class="min-h-screen bg-gray-900 text-gray-100 flex flex-col items-center justify-center p-4">

    <div class="max-w-6xl w-full bg-gray-800 rounded-2xl shadow-2xl p-6 md:p-8 flex flex-col md:flex-row gap-8">
        
        <!-- Panel de Controles Izquierdo (Acordeón en móviles) -->
        <div class="w-full md:w-1/3 flex flex-col gap-4">
            
            <div class="hidden md:block">
                <h1 class="text-3xl font-bold text-white mb-1">Generador de Laberintos</h1>
                <p class="text-gray-400 text-sm">Entradas y salidas siempre en lados opuestos cruzados.</p>
            </div>

            <!-- Botón Toggle Móvil -->
            <button id="btnToggleTabs" class="md:hidden w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-4 rounded-lg flex justify-between items-center border border-gray-600 shadow-md transition-colors">
                <span class="flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    Ajustes y Generador
                </span>
                <svg id="iconToggleTabs" class="w-5 h-5 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </button>

            <!-- Contenedor Colapsable (Oculto en móvil por defecto) -->
            <div id="tabsContainer" class="hidden flex-col gap-4 bg-gray-800 rounded-xl md:p-0 md:bg-transparent border border-gray-700 md:border-none shadow-xl md:shadow-none p-4 mt-2 md:mt-0">
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label for="cols" class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-1">Columnas</label>
                        <input type="number" id="cols" min="8" max="70" value="30" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-white transition-all text-sm">
                    </div>
                    <div>
                        <label for="cellSize" class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-1">Celda (px)</label>
                        <input type="number" id="cellSize" min="8" max="50" value="18" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-white transition-all text-sm">
                    </div>
                </div>
                
                <div>
                    <label for="mazeShape" class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-1">Forma / Silueta</label>
                    <select id="mazeShape" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-white transition-all text-sm">
                        <optgroup label="Proporciones Estándar">
                            <option value="4:3">Rectangular (4:3)</option>
                            <option value="16:9">Panorámico (16:9)</option>
                            <option value="1:1">Cuadrado (1:1)</option>
                            <option value="9:16">Vertical (9:16)</option>
                        </optgroup>
                        <optgroup label="Figuras Geométricas">
                            <option value="circle">Círculo</option>
                            <option value="star">Estrella (5 puntas)</option>
                            <option value="diamond">Diamante / Rombo</option>
                            <option value="triangle">Triángulo</option>
                            <option value="hexagon">Hexágono</option>
                            <option value="cross">Cruz / Plus</option>
                            <option value="donut">Anillo / Dona</option>
                            <option value="hourglass">Reloj de Arena</option>
                        </optgroup>
                        <optgroup label="Objetos y Símbolos">
                            <option value="shield">Escudo</option>
                            <option value="sword">Espada</option>
                            <option value="shovel">Pala de Construcción</option>
                            <option value="arrow">Flecha</option>
                            <option value="heart">Corazón</option>
                            <option value="tree">Árbol de Navidad</option>
                            <option value="lightning">Rayo</option>
                            <option value="crescent">Luna Creciente</option>
                            <option value="house">Casa</option>
                            <option value="skull">Calavera</option>
                        </optgroup>
                    </select>
                </div>

                <div>
                    <label for="mazeCount" class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-1">Cantidad a generar</label>
                    <input type="number" id="mazeCount" min="1" max="50" value="1" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-white transition-all text-sm">
                </div>
                
                <button id="btnGenerate" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-4 rounded-lg flex items-center justify-center gap-2 shadow-lg transition-colors mt-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span>Generar Laberintos</span>
                </button>

                <div class="h-px w-full bg-gray-700 my-2"></div>

                <button id="btnOpenExport" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-lg flex items-center justify-center gap-2 shadow-lg transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    <span>Exportar / Descargar</span>
                </button>
            </div>
        </div>

        <!-- Área del Canvas y Controles de Vista -->
        <div id="canvasWrapper" class="relative w-full md:w-2/3 bg-gray-900 rounded-xl border border-gray-700 flex flex-col overflow-hidden min-h-[520px]">
            
            <!-- Switch Solución Flotante (Arriba Izquierda) -->
            <div class="absolute top-4 left-4 z-20 bg-gray-800/90 backdrop-blur border border-gray-600 shadow-[0_0_15px_rgba(0,0,0,0.5)] px-3 py-2 rounded-full flex items-center gap-3">
                <span class="text-xs font-bold text-gray-200 uppercase tracking-wider">Solución</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="switchSolution" class="sr-only peer">
                    <div class="w-10 h-5 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500 shadow-inner"></div>
                </label>
            </div>

            <!-- Panel Flotante Draggable & Collapsible (Zoom/Fullscreen) -->
            <div id="floatingPanel" class="absolute top-4 right-4 z-10 flex flex-col bg-gray-800/95 backdrop-blur border border-gray-600 rounded-xl shadow-[0_0_15px_rgba(0,0,0,0.5)] overflow-hidden w-[60px] transition-all duration-300">
                <div id="dragHandle" class="w-full h-6 bg-gray-700 cursor-grab active:cursor-grabbing flex items-center justify-center border-b border-gray-600" title="Arrastrar panel">
                    <div class="flex gap-1">
                        <div class="w-1 h-1 bg-gray-400 rounded-full"></div>
                        <div class="w-1 h-1 bg-gray-400 rounded-full"></div>
                        <div class="w-1 h-1 bg-gray-400 rounded-full"></div>
                    </div>
                </div>
                <div id="panelContent" class="flex flex-col items-center p-2 gap-2">
                    <button id="btnFullscreen" class="p-2 text-gray-300 hover:text-white hover:bg-gray-600 rounded-lg transition-colors" title="Pantalla Completa">
                        <svg id="iconFullscreen" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                    </button>
                    <div class="h-px w-full bg-gray-600"></div>
                    <button id="btnZoomIn" class="p-2 text-gray-300 hover:text-white hover:bg-gray-600 rounded-lg transition-colors" title="Acercar">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    </button>
                    <span id="zoomText" class="text-[11px] font-bold text-gray-200 select-none w-full text-center">100%</span>
                    <button id="btnZoomOut" class="p-2 text-gray-300 hover:text-white hover:bg-gray-600 rounded-lg transition-colors" title="Alejar">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
                    </button>
                    <div class="h-px w-full bg-gray-600"></div>
                    <button id="btnResetZoom" class="px-1 py-1.5 text-[10px] text-gray-300 hover:text-white hover:bg-gray-600 rounded-lg transition-colors text-center leading-tight font-medium" title="Restablecer">
                        Reset<br>100%

                </div>
                <button id="btnCollapse" class="w-full bg-gray-700 hover:bg-gray-600 p-1 flex items-center justify-center border-t border-gray-600 text-gray-400 hover:text-white transition-colors">
                    <svg id="iconCollapse" class="w-4 h-4 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path></svg>
                </button>
            </div>

            <!-- Contenedor con Scroll para Navegación -->
            <div id="scrollArea" class="flex-1 w-full h-full overflow-auto flex p-4 touch-none">
                <div id="canvasContainer" class="relative m-auto shadow-[0_0_20px_rgba(0,0,0,0.6)] rounded-lg transition-all duration-200">
                    <div id="mazeSvgContainer" class="absolute top-0 left-0 w-full h-full rounded-lg overflow-hidden select-none pointer-events-none"></div>
                </div>
            </div>

            <!-- Paginación de Múltiples Laberintos -->
            <div id="paginationCtrl" class="absolute bottom-4 left-1/2 transform -translate-x-1/2 items-center gap-4 bg-gray-800/90 backdrop-blur px-5 py-2 rounded-full border border-gray-600 shadow-[0_4px_15px_rgba(0,0,0,0.5)] hidden z-20">
                <button id="btnPrevMaze" class="text-gray-300 hover:text-white hover:bg-gray-700 p-1.5 rounded-full transition-colors"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg></button>
                <span id="mazeIndexText" class="text-white font-medium text-sm w-20 text-center tracking-wide">1 / 1</span>
                <button id="btnNextMaze" class="text-gray-300 hover:text-white hover:bg-gray-700 p-1.5 rounded-full transition-colors"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></button>
            </div>
            
        </div>
    </div>

    <!-- Modal Flotante de Exportación -->
    <div id="exportModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm items-center justify-center p-4 transition-opacity">
        <div class="bg-gray-800 rounded-2xl max-w-lg w-full p-6 border border-gray-600 shadow-2xl relative">
            
            <button id="btnCloseModal" class="absolute top-4 right-4 text-gray-400 hover:text-white bg-gray-700 hover:bg-gray-600 rounded-full p-1 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            
            <h2 class="text-2xl font-bold text-white mb-6 pr-8">Exportar Laberintos</h2>
            
            <div>
                <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Descargar Actual (En pantalla)</div>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <button id="btnDownloadSvg" class="bg-gray-700 hover:bg-gray-600 text-white font-semibold py-3 px-3 rounded-lg flex flex-col items-center justify-center gap-1 shadow-md text-sm transition-colors border border-gray-600">
                        <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        <span>Laberinto SVG</span>
                    </button>
                    <button id="btnDownloadPng" class="bg-gray-700 hover:bg-gray-600 text-white font-semibold py-3 px-3 rounded-lg flex flex-col items-center justify-center gap-1 shadow-md text-sm transition-colors border border-gray-600">
                        <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        <span>Laberinto PNG</span>
                    </button>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <button id="btnDownloadSolSvg" class="bg-indigo-700 hover:bg-indigo-600 text-white font-semibold py-3 px-3 rounded-lg flex flex-col items-center justify-center gap-1 shadow-md text-sm transition-colors border border-indigo-500">
                        <svg class="w-5 h-5 text-indigo-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        <span>Solución SVG</span>
                    </button>
                    <button id="btnDownloadSolPng" class="bg-indigo-700 hover:bg-indigo-600 text-white font-semibold py-3 px-3 rounded-lg flex flex-col items-center justify-center gap-1 shadow-md text-sm transition-colors border border-indigo-500">
                        <svg class="w-5 h-5 text-indigo-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        <span>Solución PNG</span>
                    </button>
                </div>
            </div>

            <div class="mt-6">
                <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Exportar Todos (Lote ZIP)</div>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <button id="btnDownloadZipSvg" class="bg-teal-700 hover:bg-teal-600 text-white font-semibold py-3 px-3 rounded-lg flex flex-col items-center justify-center gap-1 shadow-md text-sm transition-colors border border-teal-500">
                        <svg class="w-5 h-5 text-teal-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 01-2-2V5a2 2 0 012-2h14a2 2 0 012 2v1a2 2 0 01-2 2M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path></svg>
                        <span>Laberintos ZIP (SVG)</span>
                    </button>
                    <button id="btnDownloadZipPng" class="bg-teal-700 hover:bg-teal-600 text-white font-semibold py-3 px-3 rounded-lg flex flex-col items-center justify-center gap-1 shadow-md text-sm transition-colors border border-teal-500">
                        <svg class="w-5 h-5 text-teal-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 01-2-2V5a2 2 0 012-2h14a2 2 0 012 2v1a2 2 0 01-2 2M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path></svg>
                        <span>Laberintos ZIP (PNG)</span>
                    </button>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <button id="btnDownloadZipSolSvg" class="bg-purple-700 hover:bg-purple-600 text-white font-semibold py-3 px-3 rounded-lg flex flex-col items-center justify-center gap-1 shadow-md text-sm transition-colors border border-purple-500">
                        <svg class="w-5 h-5 text-purple-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 01-2-2V5a2 2 0 012-2h14a2 2 0 012 2v1a2 2 0 01-2 2M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path></svg>
                        <span>Soluciones ZIP (SVG)</span>
                    </button>
                    <button id="btnDownloadZipSolPng" class="bg-purple-700 hover:bg-purple-600 text-white font-semibold py-3 px-3 rounded-lg flex flex-col items-center justify-center gap-1 shadow-md text-sm transition-colors border border-purple-500">
                        <svg class="w-5 h-5 text-purple-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 01-2-2V5a2 2 0 012-2h14a2 2 0 012 2v1a2 2 0 01-2 2M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path></svg>
                        <span>Soluciones ZIP (PNG)</span>
                    </button>
                </div>
            </div>
            
        </div>
    </div>

    <script>
        // ==========================================
        // GESTIÓN DEL PANEL MÓVIL (ACORDEÓN)
        // ==========================================
        const btnToggleTabs = document.getElementById('btnToggleTabs');
        const tabsContainer = document.getElementById('tabsContainer');
        const iconToggleTabs = document.getElementById('iconToggleTabs');

        btnToggleTabs.addEventListener('click', () => {
            tabsContainer.classList.toggle('hidden');
            tabsContainer.classList.toggle('flex');
            iconToggleTabs.classList.toggle('rotate-180');
        });

        // ==========================================
        // GESTIÓN DEL MODAL DE EXPORTACIÓN
        // ==========================================
        const exportModal = document.getElementById('exportModal');
        const btnOpenExport = document.getElementById('btnOpenExport');
        const btnCloseModal = document.getElementById('btnCloseModal');

        btnOpenExport.addEventListener('click', () => {
            exportModal.classList.remove('hidden');
            exportModal.classList.add('flex');
        });

        btnCloseModal.addEventListener('click', () => {
            exportModal.classList.add('hidden');
            exportModal.classList.remove('flex');
        });

        // Cerrar modal clickeando afuera
        exportModal.addEventListener('click', (e) => {
            if (e.target === exportModal) {
                exportModal.classList.add('hidden');
                exportModal.classList.remove('flex');
            }
        });

        // ==========================================
        // VARIABLES GLOBALES Y SETUP
        // ==========================================
        const canvasWrapper = document.getElementById('canvasWrapper');
        const container = document.getElementById('canvasContainer');
        const mazeSvgContainer = document.getElementById('mazeSvgContainer');
        const paginationCtrl = document.getElementById('paginationCtrl');
        const switchSolution = document.getElementById('switchSolution');
        
        let cols, rows, w;
        let totalWidth = 0;
        let totalHeight = 0;
        let zoomLevel = 1;
        
        let generatedMazes = []; // Array of { emptySVG: '', solvedSVG: '' }
        let currentMazeIndex = 0;
        let isSolutionVisible = false;
        
        class Cell {
            constructor(i, j, active = true) {
                this.i = i;
                this.j = j;
                this.active = active;
                this.walls = [true, true, true, true]; 
                this.visited = !active; 
            }
            checkNeighbors(grid) {
                let neighbors = [];
                let top = grid[index(this.i, this.j - 1)];
                let right = grid[index(this.i + 1, this.j)];
                let bottom = grid[index(this.i, this.j + 1)];
                let left = grid[index(this.i - 1, this.j)];
                
                if (top && top.active && !top.visited) neighbors.push(top);
                if (right && right.active && !right.visited) neighbors.push(right);
                if (bottom && bottom.active && !bottom.visited) neighbors.push(bottom);
                if (left && left.active && !left.visited) neighbors.push(left);
                
                if (neighbors.length > 0) {
                    let r = Math.floor(Math.random() * neighbors.length);
                    return neighbors[r];
                } else {
                    return undefined;
                }
            }
        }

        function index(i, j) {
            if (i < 0 || j < 0 || i > cols - 1 || j > rows - 1) return -1;
            return i + j * cols;
        }

        function removeWalls(a, b) {
            let x = a.i - b.i;
            if (x === 1) { a.walls[3] = false; b.walls[1] = false; } 
            else if (x === -1) { a.walls[1] = false; b.walls[3] = false; }
            let y = a.j - b.j;
            if (y === 1) { a.walls[0] = false; b.walls[2] = false; } 
            else if (y === -1) { a.walls[2] = false; b.walls[0] = false; }
        }

        // ==========================================
        // ALGORITMOS DE FORMAS
        // ==========================================
        function isCellActive(i, j, cCols, cRows, shape) {
            const u = (i + 0.5) / cCols * 2 - 1;
            const v = (j + 0.5) / cRows * 2 - 1;
            const dist = Math.hypot(u, v);

            switch (shape) {
                case 'circle': return dist <= 0.95;
                case 'star': {
                    let angle = Math.atan2(v, u);
                    let outerR = 0.95, innerR = 0.38, pts = 5;
                    let step = Math.PI / pts;
                    let a = (angle + Math.PI / 2) % (2 * Math.PI);
                    if (a < 0) a += 2 * Math.PI;
                    let n = Math.floor(a / step);
                    let frac = (a % step) / step;
                    let r = (n % 2 === 0) ? outerR * (1 - frac) + innerR * frac : innerR * (1 - frac) + outerR * frac;
                    return dist <= r;
                }
                case 'diamond': return (Math.abs(u) + Math.abs(v)) <= 0.95;
                case 'triangle': return v >= -0.85 && Math.abs(u) <= 0.9 * (0.9 - v) / 1.75;
                case 'hexagon': return Math.abs(u) <= 0.9 && (Math.abs(u) * 0.5 + Math.abs(v) * 0.866) <= 0.9;
                case 'cross': return Math.abs(u) <= 0.35 || Math.abs(v) <= 0.35;
                case 'donut': return dist >= 0.38 && dist <= 0.95;
                case 'hourglass': return Math.abs(u) <= (0.85 * Math.abs(v) + 0.1);
                case 'shield':
                    if (v < 0) return Math.abs(u) <= 0.9;
                    return Math.abs(u) <= 0.9 * (1 - Math.pow(v / 0.95, 2));
                case 'sword':
                    if (v >= -0.9 && v <= 0.3) return Math.abs(u) <= 0.18;
                    if (v > 0.3 && v <= 0.45) return Math.abs(u) <= 0.85;
                    if (v > 0.45 && v <= 0.8) return Math.abs(u) <= 0.15;
                    if (v > 0.8 && v <= 0.95) return dist <= 0.95 && Math.abs(u) <= 0.35;
                    return false;
                case 'shovel':
                    if (v >= -0.9 && v <= -0.1) return Math.abs(u) <= 0.75;
                    if (v > -0.1 && v <= 0.7) return Math.abs(u) <= 0.15;
                    if (v > 0.7 && v <= 0.95) return Math.abs(u) <= 0.45 && Math.abs(u) >= 0.15 || v >= 0.85;
                    return false;
                case 'arrow':
                    if (v <= 0.1) return v >= -0.95 && Math.abs(u) <= 0.95 * (0.1 - v) / 1.05;
                    return v <= 0.95 && Math.abs(u) <= 0.3;
                case 'heart': {
                    let y = -v + 0.2, x = u * 1.2;
                    return Math.pow(x*x + y*y - 0.6, 3) - x*x * Math.pow(y, 3) <= 0;
                }
                case 'tree':
                    if (v > 0.35) return Math.abs(u) <= 0.25 && v <= 0.95;
                    if (v >= -0.9 && v <= -0.2) return Math.abs(u) <= 0.6 * (-0.2 - v) / 0.7;
                    if (v >= -0.3 && v <= 0.35) return Math.abs(u) <= 0.85 * (0.35 - v) / 0.65;
                    return false;
                case 'lightning':
                    if (v >= -0.9 && v < -0.2) return u >= -0.8 && u <= 0.2 - (v + 0.9)*0.4;
                    if (v >= -0.2 && v < 0.2) return u >= -0.4 && u <= 0.8;
                    if (v >= 0.2 && v <= 0.95) return u >= -0.2 + (v - 0.2)*0.4 && u <= 0.4;
                    return false;
                case 'crescent': return (dist <= 0.95) && !(Math.hypot(u - 0.35, v - 0.1) <= 0.7);
                case 'house':
                    if (v <= -0.1) return v >= -0.9 && Math.abs(u) <= 0.95 * (-0.1 - v) / 0.8;
                    return v <= 0.9 && Math.abs(u) <= 0.85;
                case 'skull':
                    if (v <= 0.2) return Math.hypot(u, v + 0.2) <= 0.75;
                    return v <= 0.85 && Math.abs(u) <= 0.45;
                default: return true;
            }
        }

        function getOppositeCrossedEntries(grid, cols, rows) {
            let edges = [];
            for (let cell of grid) {
                if (!cell.active) continue;
                let i = cell.i, j = cell.j;
                if (j === 0 || !grid[index(i, j - 1)] || !grid[index(i, j - 1)].active) edges.push({ cell, wall: 0, x: i, y: j });
                if (i === cols - 1 || !grid[index(i + 1, j)] || !grid[index(i + 1, j)].active) edges.push({ cell, wall: 1, x: i, y: j });
                if (j === rows - 1 || !grid[index(i, j + 1)] || !grid[index(i, j + 1)].active) edges.push({ cell, wall: 2, x: i, y: j });
                if (i === 0 || !grid[index(i - 1, j)] || !grid[index(i - 1, j)].active) edges.push({ cell, wall: 3, x: i, y: j });
            }
            let groups = { 0: [], 1: [], 2: [], 3: [] };
            for (let e of edges) groups[e.wall].push(e);

            let validPairs = [];
            if (groups[0].length > 0 && groups[2].length > 0) { validPairs.push([0, 2]); validPairs.push([2, 0]); }
            if (groups[1].length > 0 && groups[3].length > 0) { validPairs.push([1, 3]); validPairs.push([3, 1]); }

            if (validPairs.length === 0) {
                let start = edges[0];
                return { startEntry: start, endEntry: edges[edges.length - 1] || start };
            }
            let chosenPair = validPairs[Math.floor(Math.random() * validPairs.length)];
            let startGroup = groups[chosenPair[0]], endGroup = groups[chosenPair[1]];
            let isHorizontalAxis = (chosenPair[0] === 0 || chosenPair[0] === 2);
            
            let minStart = Math.min(...startGroup.map(e => isHorizontalAxis ? e.x : e.y)), maxStart = Math.max(...startGroup.map(e => isHorizontalAxis ? e.x : e.y));
            let minEnd = Math.min(...endGroup.map(e => isHorizontalAxis ? e.x : e.y)), maxEnd = Math.max(...endGroup.map(e => isHorizontalAxis ? e.x : e.y));

            let startEntry = startGroup[Math.floor(Math.random() * startGroup.length)];
            let startVal = isHorizontalAxis ? startEntry.x : startEntry.y;
            let startRange = maxStart - minStart, startZone = 1; 
            if (startRange > 0) {
                let p = (startVal - minStart) / startRange;
                if (p < 0.33) startZone = 0; else if (p > 0.66) startZone = 2; else startZone = 1;
            }

            let endRange = maxEnd - minEnd;
            let validEnds = endGroup.filter(e => {
                let endVal = isHorizontalAxis ? e.x : e.y, endZone = 1;
                if (endRange > 0) {
                    let p = (endVal - minEnd) / endRange;
                    if (p < 0.33) endZone = 0; else if (p > 0.66) endZone = 2; else endZone = 1;
                }
                return endZone !== startZone;
            });
            if (validEnds.length === 0) validEnds = endGroup;
            let endEntry = validEnds[Math.floor(Math.random() * validEnds.length)];
            return { startEntry, endEntry };
        }

        function getMarkerSVG(entry, color) {
            let { cell, wall } = entry;
            let cx = cell.i * w, cy = cell.j * w;
            let rx, ry, rw, rh;

            if (wall === 0) { rx = cx + w * 0.15; ry = cy - w * 0.25; rw = w * 0.7; rh = w * 0.4; }
            else if (wall === 1) { rx = cx + w - w * 0.15; ry = cy + w * 0.15; rw = w * 0.4; rh = w * 0.7; }
            else if (wall === 2) { rx = cx + w * 0.15; ry = cy + w - w * 0.15; rw = w * 0.7; rh = w * 0.4; }
            else if (wall === 3) { rx = cx - w * 0.25; ry = cy + w * 0.15; rw = w * 0.4; rh = w * 0.7; }
            
            return `<rect x="${rx}" y="${ry}" width="${rw}" height="${rh}" fill="${color}" rx="${w * 0.08}"/>\n`;
        }

        // ==========================================
        // GENERACIÓN Y SOLUCIÓN DEL LABERINTO
        // ==========================================
        function generateBatch() {
            const count = parseInt(document.getElementById('mazeCount').value) || 1;
            cols = parseInt(document.getElementById('cols').value);
            w = parseInt(document.getElementById('cellSize').value);
            const shape = document.getElementById('mazeShape').value;

            if(cols < 8) cols = 8; if(cols > 100) cols = 100;
            if(w < 5) w = 5; if(w > 100) w = 100;

            if (shape === '4:3') rows = Math.round(cols * (3 / 4));
            else if (shape === '16:9') rows = Math.round(cols * (9 / 16));
            else if (shape === '9:16') rows = Math.round(cols * (16 / 9));
            else rows = cols; 
            if(rows < 8) rows = 8;

            const padding = 20; 
            totalWidth = (cols * w) + (padding * 2);
            totalHeight = (rows * w) + (padding * 2);

            generatedMazes = [];
            for(let c = 0; c < count; c++) {
                generatedMazes.push(createSingleMazeSVG(shape, padding));
            }

            currentMazeIndex = 0;
            isSolutionVisible = false;
            switchSolution.checked = false;

            zoomLevel = 1;
            updateZoomDisplay();
            updateMazeView();

            if (count > 1) paginationCtrl.style.display = 'flex';
            else paginationCtrl.style.display = 'none';
            
            // Cerrar el panel móvil tras generar para ahorrar espacio
            if (window.innerWidth < 768) {
                tabsContainer.classList.add('hidden');
                tabsContainer.classList.remove('flex');
                iconToggleTabs.classList.remove('rotate-180');
            }
        }

        function createSingleMazeSVG(shape, padding) {
            let grid = [];
            for (let j = 0; j < rows; j++) {
                for (let i = 0; i < cols; i++) {
                    let active = isCellActive(i, j, cols, rows, shape);
                    grid.push(new Cell(i, j, active));
                }
            }

            let { startEntry, endEntry } = getOppositeCrossedEntries(grid, cols, rows);
            if(!startEntry) {
                return { 
                    emptySVG: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${totalWidth} ${totalHeight}"></svg>`,
                    solvedSVG: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${totalWidth} ${totalHeight}"></svg>`
                };
            }

            startEntry.cell.walls[startEntry.wall] = false;
            endEntry.cell.walls[endEntry.wall] = false;

            // 1. Backtracking (Generación del Laberinto)
            let stack = [];
            let current = startEntry.cell;
            current.visited = true;
            while (true) {
                let next = current.checkNeighbors(grid);
                if (next) {
                    next.visited = true;
                    stack.push(current);
                    removeWalls(current, next);
                    current = next;
                } else if (stack.length > 0) {
                    current = stack.pop();
                } else break;
            }

            // 2. Búsqueda de Solución (BFS)
            let queue = [startEntry.cell];
            let visitedPath = new Set();
            visitedPath.add(startEntry.cell);
            let parentMap = new Map();

            while(queue.length > 0) {
                let curr = queue.shift();
                if(curr === endEntry.cell) break;

                let neighbors = [];
                let top = grid[index(curr.i, curr.j - 1)];
                let right = grid[index(curr.i + 1, curr.j)];
                let bottom = grid[index(curr.i, curr.j + 1)];
                let left = grid[index(curr.i - 1, curr.j)];

                if(!curr.walls[0] && top) neighbors.push(top);
                if(!curr.walls[1] && right) neighbors.push(right);
                if(!curr.walls[2] && bottom) neighbors.push(bottom);
                if(!curr.walls[3] && left) neighbors.push(left);

                for(let n of neighbors) {
                    if(!visitedPath.has(n)) {
                        visitedPath.add(n);
                        parentMap.set(n, curr);
                        queue.push(n);
                    }
                }
            }

            let pathNodes = [];
            let pCurr = endEntry.cell;
            while(pCurr) {
                pathNodes.push(pCurr);
                pCurr = parentMap.get(pCurr);
            }
            pathNodes.reverse();

            // Dibujar ruta de la solución
            let solD = "";
            for(let k=0; k<pathNodes.length; k++){
                let px = pathNodes[k].i * w + w/2;
                let py = pathNodes[k].j * w + w/2;
                if(k===0) solD += `M${px},${py} `;
                else solD += `L${px},${py} `;
            }

            // 3. Renderizado de SVG
            let content = `  <rect width="${totalWidth}" height="${totalHeight}" fill="#ffffff"/>\n`;
            content += `  <g transform="translate(${padding}, ${padding})">\n`;
            content += `    ${getMarkerSVG(startEntry, "#10b981")}`; 
            content += `    ${getMarkerSVG(endEntry, "#ef4444")}`;   
            
            let pathData = "";
            for (let i = 0; i < grid.length; i++) {
                let cell = grid[i];
                if (!cell.active) continue;
                let x = cell.i * w, y = cell.j * w;
                
                if (cell.walls[0]) pathData += `M${x},${y} L${x + w},${y} `;
                if (cell.walls[1]) pathData += `M${x + w},${y} L${x + w},${y + w} `;
                if (cell.walls[2]) pathData += `M${x + w},${y + w} L${x},${y + w} `;
                if (cell.walls[3]) pathData += `M${x},${y + w} L${x},${y} `;
            }

            content += `    <path d="${pathData.trim()}" stroke="#000000" stroke-width="4" stroke-linecap="square" fill="none"/>\n`;
            content += `  </g>\n`;

            let solutionContent = `  <g transform="translate(${padding}, ${padding})">\n`;
            solutionContent += `    <path d="${solD.trim()}" stroke="#10b981" stroke-width="${Math.max(2, w * 0.4)}" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>\n`;
            solutionContent += `  </g>\n`;

            return {
                emptySVG: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${totalWidth} ${totalHeight}" width="100%" height="100%">\n${content}</svg>`,
                solvedSVG: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${totalWidth} ${totalHeight}" width="100%" height="100%">\n${content}${solutionContent}</svg>`
            };
        }

        function updateMazeView() {
            if(generatedMazes.length === 0) return;
            const maze = generatedMazes[currentMazeIndex];
            mazeSvgContainer.innerHTML = isSolutionVisible ? maze.solvedSVG : maze.emptySVG;
            document.getElementById('mazeIndexText').innerText = `${currentMazeIndex + 1} / ${generatedMazes.length}`;
        }

        // ==========================================
        // EVENTOS INTERACTIVOS (PAGINACION Y TOGGLE SOLUCIÓN)
        // ==========================================
        document.getElementById('btnPrevMaze').addEventListener('click', () => {
            if(currentMazeIndex > 0) { currentMazeIndex--; updateMazeView(); }
        });
        document.getElementById('btnNextMaze').addEventListener('click', () => {
            if(currentMazeIndex < generatedMazes.length - 1) { currentMazeIndex++; updateMazeView(); }
        });
        
        switchSolution.addEventListener('change', (e) => {
            isSolutionVisible = e.target.checked;
            updateMazeView();
        });

        // ==========================================
        // FUNCIONES DE ZOOM Y CONTROLES VISUALES
        // ==========================================
        function updateZoomDisplay() {
            document.getElementById('zoomText').innerText = Math.round(zoomLevel * 100) + '%';
            container.style.width = (totalWidth * zoomLevel) + 'px';
            container.style.height = (totalHeight * zoomLevel) + 'px';
        }

        document.getElementById('btnZoomIn').addEventListener('click', () => { zoomLevel += 0.25; if(zoomLevel > 4) zoomLevel = 4; updateZoomDisplay(); });
        document.getElementById('btnZoomOut').addEventListener('click', () => { zoomLevel -= 0.25; if(zoomLevel < 0.25) zoomLevel = 0.25; updateZoomDisplay(); });
        document.getElementById('btnResetZoom').addEventListener('click', () => { zoomLevel = 1; updateZoomDisplay(); });
        
        document.getElementById('btnFullscreen').addEventListener('click', () => { 
            if (!document.fullscreenElement) canvasWrapper.requestFullscreen().catch(err => alert(err.message)); 
            else document.exitFullscreen(); 
        });
        
        document.addEventListener('fullscreenchange', () => {
            const icon = document.getElementById('iconFullscreen');
            if (document.fullscreenElement) icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 3v3a2 2 0 01-2 2H3m18 0h-3a2 2 0 01-2-2V3m0 18v-3a2 2 0 012-2h3M3 16h3a2 2 0 012 2v3"></path>`;
            else icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>`;
        });

        // ==========================================
        // LÓGICA DEL PANEL FLOTANTE
        // ==========================================
        const panel = document.getElementById('floatingPanel'), dragHandle = document.getElementById('dragHandle'), panelContent = document.getElementById('panelContent'), btnCollapse = document.getElementById('btnCollapse'), iconCollapse = document.getElementById('iconCollapse');
        let isDraggingPanel = false, startMouseX, startMouseY, initialPanelX, initialPanelY;
        
        dragHandle.addEventListener('mousedown', (e) => {
            isDraggingPanel = true; startMouseX = e.clientX; startMouseY = e.clientY; initialPanelX = panel.offsetLeft; initialPanelY = panel.offsetTop; panel.style.right = 'auto'; panel.style.transition = 'none'; 
        });
        
        window.addEventListener('mousemove', (e) => {
            if (!isDraggingPanel) return; e.preventDefault(); const dx = e.clientX - startMouseX, dy = e.clientY - startMouseY; let newLeft = initialPanelX + dx, newTop = initialPanelY + dy; const maxLeft = canvasWrapper.clientWidth - panel.clientWidth, maxTop = canvasWrapper.clientHeight - panel.clientHeight;
            newLeft = Math.max(0, Math.min(newLeft, maxLeft)); newTop = Math.max(0, Math.min(newTop, maxTop));
            panel.style.left = `${newLeft}px`; panel.style.top = `${newTop}px`;
        });
        
        window.addEventListener('mouseup', () => { if (isDraggingPanel) { isDraggingPanel = false; panel.style.transition = ''; } });
        
        let isCollapsed = false;
        btnCollapse.addEventListener('click', () => {
            isCollapsed = !isCollapsed;
            if (isCollapsed) { panelContent.style.display = 'none'; iconCollapse.classList.add('rotate-180'); } 
            else { panelContent.style.display = 'flex'; iconCollapse.classList.remove('rotate-180'); }
        });

        // ==========================================
        // EXPORTACIÓN (SVG, PNG y ZIP 300DPI)
        // ==========================================
        document.getElementById('btnGenerate').addEventListener('click', generateBatch);
        
        function downloadSingleSVG(isSolution) {
            if(generatedMazes.length === 0) return;
            const svgContent = isSolution ? generatedMazes[currentMazeIndex].solvedSVG : generatedMazes[currentMazeIndex].emptySVG;
            const blob = new Blob([svgContent], { type: "image/svg+xml" });
            const url = URL.createObjectURL(blob), link = document.createElement('a');
            const suf = isSolution ? '-solucion' : '';
            link.download = `laberinto-${cols}x${rows}-n${currentMazeIndex + 1}${suf}.svg`;
            link.href = url; link.click(); URL.revokeObjectURL(url);
        }

        function downloadSinglePNG(isSolution) {
            if(generatedMazes.length === 0) return;
            const svgContent = isSolution ? generatedMazes[currentMazeIndex].solvedSVG : generatedMazes[currentMazeIndex].emptySVG;
            const blob = new Blob([svgContent], { type: "image/svg+xml;charset=utf-8" });
            const url = URL.createObjectURL(blob), img = new Image();
            img.onload = function() {
                const scale300DPI = 300 / 72, highResWidth = Math.round(totalWidth * scale300DPI), highResHeight = Math.round(totalHeight * scale300DPI);
                const canvas = document.createElement('canvas'); canvas.width = highResWidth; canvas.height = highResHeight;
                const ctx = canvas.getContext('2d'); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(img, 0, 0, highResWidth, highResHeight);
                const link = document.createElement('a'); 
                const suf = isSolution ? '-solucion' : '';
                link.download = `laberinto-${cols}x${rows}-n${currentMazeIndex + 1}${suf}-300dpi.png`;
                link.href = canvas.toDataURL('image/png', 1.0); link.click(); URL.revokeObjectURL(url);
            };
            img.src = url;
        }

        async function downloadBatchZip(format, isSolution) {
            if (generatedMazes.length === 0) return;
            const zip = new JSZip();
            const folderName = isSolution ? `soluciones_${format}` : `laberintos_${format}`;
            const folder = zip.folder(folderName);
            const scale300DPI = 300 / 72;
            const highResWidth = Math.round(totalWidth * scale300DPI), highResHeight = Math.round(totalHeight * scale300DPI);
            const suf = isSolution ? '_solucion' : '';

            for (let i = 0; i < generatedMazes.length; i++) {
                const svgContent = isSolution ? generatedMazes[i].solvedSVG : generatedMazes[i].emptySVG;
                
                if (format === 'svg') {
                    folder.file(`laberinto_${i + 1}${suf}.svg`, svgContent);
                } else if (format === 'png') {
                    const url = URL.createObjectURL(new Blob([svgContent], { type: "image/svg+xml;charset=utf-8" }));
                    const dataUrl = await new Promise(resolve => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas'); canvas.width = highResWidth; canvas.height = highResHeight;
                            const ctx = canvas.getContext('2d'); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(img, 0, 0, highResWidth, highResHeight);
                            URL.revokeObjectURL(url); resolve(canvas.toDataURL('image/png', 1.0).split(',')[1]);
                        }; img.src = url;
                    });
                    folder.file(`laberinto_${i + 1}${suf}_300dpi.png`, dataUrl, { base64: true });
                }
            }
            const content = await zip.generateAsync({ type: "blob" }), url = URL.createObjectURL(content), link = document.createElement('a');
            link.download = `${folderName}-lote.zip`; link.href = url; link.click(); URL.revokeObjectURL(url);
        }

        document.getElementById('btnDownloadSvg').addEventListener('click', () => downloadSingleSVG(false));
        document.getElementById('btnDownloadPng').addEventListener('click', () => downloadSinglePNG(false));
        document.getElementById('btnDownloadSolSvg').addEventListener('click', () => downloadSingleSVG(true));
        document.getElementById('btnDownloadSolPng').addEventListener('click', () => downloadSinglePNG(true));

        document.getElementById('btnDownloadZipSvg').addEventListener('click', () => downloadBatchZip('svg', false));
        document.getElementById('btnDownloadZipPng').addEventListener('click', () => downloadBatchZip('png', false));
        document.getElementById('btnDownloadZipSolSvg').addEventListener('click', () => downloadBatchZip('svg', true));
        document.getElementById('btnDownloadZipSolPng').addEventListener('click', () => downloadBatchZip('png', true));

        window.onload = generateBatch;
    </script>

    <script>
    // Bloquear clic derecho (Anticlic)
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });

    // Bloquear atajos de teclado de desarrollador
    document.addEventListener('keydown', function(e) {
        if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault(); return false;
        }
        if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) {
            e.preventDefault(); return false;
        }
        if (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's')) {
            e.preventDefault(); return false;
        }
    });
    </script>
